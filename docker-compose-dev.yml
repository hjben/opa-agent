version: "3.9"

services:
  opa:
    image: openpolicyagent/opa:latest-debug
    container_name: opa
    platform: linux/amd64
    command: ["run", "--server", "--log-level", "debug", "/app/opa/policy", "--addr", "0.0.0.0:8181"]
    volumes:
      - ./opa/policy:/app/opa/policy
    ports:
      - "8181:8181"
    networks:
      - mcp-network

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: opa_db
    ports:
      - "3306:3306"
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mcp-network
  dummy-api:
    build:
      context: .
      dockerfile: dummy_api/Dockerfile
      platforms:
        - linux/amd64
    container_name: dummy-api
    ports:
      - "8085:8085"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8085"]
    depends_on:
      - mariadb
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
